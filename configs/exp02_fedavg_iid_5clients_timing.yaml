# Experiment 2 timing validation:
# Two-round VinDr binary FedAvg run with 5 IID clients.
#
# This configuration validates the corrected runtime pipeline before
# launching the official 50-round Experiment 2.

experiment_id: "exp02_fedavg_iid_5clients_timing_seed42"
run_type: "flower_fedavg_timing"

project_root: "/workspace/thesis-fl-xai"
raw_data_dir: "/workspace/data/raw/vindr"
output_dir: "/workspace/thesis-fl-xai/outputs"

train_csv: "/workspace/data/raw/vindr/train.csv"
train_image_dir: "/workspace/data/raw/vindr/train"

dataset: "vindr"
task: "binary_abnormal"

# Reuse the exact canonical split created by Experiment 1.
use_full_dataset: true
reuse_split_files: true

canonical_train_split_path: "/workspace/thesis-fl-xai/data/interim/exp01_centralized_vindr_binary_seed42_train_split.csv"
canonical_val_split_path: "/workspace/thesis-fl-xai/data/interim/exp01_centralized_vindr_binary_seed42_val_split.csv"
canonical_xai_ids_path: "/workspace/thesis-fl-xai/data/interim/exp01_centralized_vindr_binary_seed42_xai_image_ids.csv"

val_fraction: 0.20

# Loaded for compatibility with the common Phase 6 data preparation.
xai_subset_size: 200

# Model
model_name: "resnet18"
num_classes: 2
pretrained: false
image_size: 224

# Image loading
image_source: "cache"
image_cache_dir: "/workspace/thesis-fl-xai/data/processed/vindr_binary_224_png"
image_cache_extension: ".png"

# Used only by the separate cache-generation command.
cache_num_workers: 8

# Local training
batch_size: 16
learning_rate: 0.0001
weight_decay: 0.01
horizontal_flip: true
rotation_degrees: 0.0

# Federated learning
fl_algorithm: "fedavg"
fl_num_clients: 5

# Timing test only
fl_num_rounds: 2

fl_local_epochs: 1
split_type: "iid"

# Flower client execution
#
# Keep the original worker settings during the first optimized test.
# This isolates the speedup caused by caching and centralized evaluation.
fl_client_device: "cuda"
fl_client_num_cpus: 2
fl_client_num_gpus: 1.0
fl_num_workers: 2

# Save both timing-test rounds for inspection.
save_checkpoints_every: 1
save_initial_checkpoint: true

# Reproducibility
seed: 42

# Output behavior
create_output_zip: false